# Atlite

cutout_dir: /groups/EXTREMES/cutouts

cutout_names:                           # optional: omit to process ALL .nc files in cutout_dir
  - europe-2014-era5
  - europe-2015-era5
  - europe-2016-era5
  - europe-2017-era5
  # - europe-2022-era5
  # - europe-2023-era5
  # - europe-2024-era5
  # - europe-2025-era5
  
features:
  - wind_gust
  - lake_s_temperature

feature_shortcodes:        # ERA5 GRIB shortcode for each feature — used to name output files
  wind_gust: fg10
  lake_s_temperature: lmlt
  lake_t_temperature: ltlt

# Damage

nuclear:
  shutdown_water_temp: 301  # K — shutdown water temperature threshold (28°C + 273)
  design_water_temp: 293  # K — design water temperature (20°C + 273)
  shutdown_period: 24    # hours — shutdown period
  vulnerability_compression: 2.13  # DWT-anchored threshold scaling: thresh_eff = round(thresh * c); c=1 = original table
  binary_shutdown: true           # true = hard step at SWT; false = gradual ramp via water_temperature_regulations.csv

wind:
  onwind:
    sustain_hours: 14    # hours — each gust damage event persists for this long 
    gust_multiplier: 1 # scaling factor from 10 m gust speed to hub-height extreme wind speed
  offwind-ac:
    sustain_hours: 36
    gust_multiplier: 1
  offwind-dc:
    sustain_hours: 36
    gust_multiplier: 1
  offwind-float:
    sustain_hours: 36
    gust_multiplier: 1