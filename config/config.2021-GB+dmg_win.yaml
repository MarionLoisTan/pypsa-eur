tutorial: true

run:
  name: "all"
  prefix: "2021-GB"

  scenarios:
    enable: true
    file: "config/scen.2021+dmg_win.yaml"
  disable_progressbar: true
  shared_resources:
    policy: false

enable:
  build_cutout: false
  retrieve_cutout: true

scenario:
  clusters:
  - 5
  opts:
  - ''
  sector_opts:
  - ''
  planning_horizons: []

countries: ['GB']

electricity:

  extendable_carriers:
    Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, biomass]
    StorageUnit: [battery]
    Store: [H2]
    Link: [H2 pipeline]

  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, hydro]
  co2limit_enable: true
  co2limit: 0

  powerplants_filter: "(DateOut >= 2017 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear')"
  transmission_limit: v1.0

  estimate_renewable_capacities:
    enable: true
    from_gem: true
    year: 2022
    # expansion_limit: 2

custom:
  biomass_max_cap_mw: 5500
  solar_max_cap_mw: 45000      
  onwind_max_cap_mw: 30000      
  offwind_max_cap_mw: 50000     
  nuclear_p_min_pu: 0.3
  marginal_cost_overrides:
    solar: 0.01
    solar-hsat: 0.015
    onwind: 0.013
    offwind-ac: 0.016
    offwind-dc: 0.019

load:
  scaling_factor: 1.25

data: # added section due to forked repo, see issue #2016 in repo
  cutout:
    source: build 
    version: unknown

atlite:
  default_cutout: europe-2021-era5_fg10_lmlt


renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  temporal:
    resolution_elec: False
    resolution_sector: 3h

solving:
  options:
    noisy_costs: true
    # assign_all_duals: true

plotting:
  map:
    boundaries:
  eu_node_location:
    x: -5.5
    y: 46.
  costs_max: 1000
  costs_threshold: 0.0000001
  energy_max:
  energy_min:
  energy_threshold: 0.000001